[project]
name = "bitedge"
version = "0.1.0"
description = "On-device learning with error-diffusion training: integer kernels, measured memory budgets, device-physics firing"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "numpy",
    "psutil>=7.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bitedge"]


[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
root = ["src"]
