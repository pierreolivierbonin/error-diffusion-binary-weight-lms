[project]
name = "bitdiffusion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.9",
    "numpy>=1.26",
    "tiktoken>=0.13.0",
    "pyarrow>=25.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.0",
    "pre-commit>=4.6.0",
    "pypdf>=6.14.2",
    "ruff",
    "ty",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 110
src = ["src"]
extend-exclude = ["exp2.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ty.environment]
root = ["./src"]

[tool.ty.src]
include = ["src", "tools"]
